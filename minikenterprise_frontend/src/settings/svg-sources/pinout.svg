<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!--
  Editable copy of the ESP8266 pinout diagram from settings/index.html.
  Self-contained (styles embedded below) so it opens correctly in Inkscape,
  Illustrator, Affinity, etc. This file is NOT loaded by the app - after
  editing, copy the shapes back into the <svg class="pinout-diagram"> block
  in ../index.html, keeping the class="..." attributes (pinout-board,
  pin-circle, pin-name, pin-gpio, etc.) so ../settings.css keeps styling it.
-->

