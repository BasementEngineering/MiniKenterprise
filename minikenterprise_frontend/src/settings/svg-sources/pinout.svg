  <style
     id="style1"><![CDATA[
        .board-pcb { fill: rgb(15, 92, 140); stroke: rgb(8, 58, 88); stroke-width: 2; }
        .antenna-housing { fill: rgb(28, 28, 28); }
        .antenna-trace { fill: none; stroke: rgb(201, 146, 42); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
        .wifi-module { fill: rgb(58, 42, 32); stroke: rgb(20, 14, 10); stroke-width: 1.5; }
        .wifi-module-text { fill: white; font-size: 11px; font-weight: bold; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .wifi-module-subtext { fill: rgb(201, 146, 42); font-size: 9px; font-style: italic; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .reset-button { fill: rgb(192, 57, 43); stroke: rgb(123, 36, 28); stroke-width: 1.5; }
        .usb-port { fill: rgb(176, 176, 176); stroke: rgb(119, 119, 119); stroke-width: 1; }
        .board-silk { fill: rgba(255, 255, 255, 0.85); font-size: 8px; letter-spacing: 0.5px; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .board-name { fill: rgba(255, 255, 255, 0.85); font-size: 12px; font-style: italic; font-family: Georgia, "Times New Roman", serif; }
        .pin-circle { fill: rgb(224, 224, 224); stroke: rgb(119, 119, 119); stroke-width: 1.5; }
        .pin-name { fill: white; font-size: 13px; font-weight: bold; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .pin-gpio { fill: black; font-size: 11px; font-style: italic; font-family: Verdana, Geneva, Tahoma, sans-serif; }
        .pin-assignment { fill: rgb(34, 139, 34); font-weight: bold; font-style: normal; }
        .pinout-row--reserved .pin-circle { fill: rgb(255, 99, 71); }
        .pinout-row--reserved .pin-name, .pinout-row--reserved .pin-gpio { fill: rgb(255, 99, 71); font-weight: bold; font-style: normal; }
        .pinout-reserved-note { fill: rgb(255, 99, 71); font-size: 11px; }
    ]]></style>
